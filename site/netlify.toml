[build]
  publish = "."

# Same-origin proxy to the inventory API of the previous Next.js deploy (permalink keeps its functions alive)
[[redirects]]
  from = "/api/*"
  to = "https://6a957d131ca32346024bc569--ahorapep.netlify.app/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
